# Ledgerline credential broker config. Values come from the
# environment. They never come from this file. Keep this file
# in your repo. Keep the values in your shell or secret manager.
#
# Each credential goes into a header on every request the
# gateway forwards to the upstream. The agent never holds the
# upstream credentials. A request that carries a brokered header
# with a different value is denied. That value is a foreign
# credential. A tool call whose arguments contain a brokered
# value is denied before witnessing. The secret never reaches
# the ledger. Upstream responses that carry a brokered value are
# redacted. The agent sees them only after redaction.
#
# A value shorter than 8 characters refuses to start.
# Substring scans on short values would false-positive on
# ordinary traffic.
version: 1
credentials:
  - name: upstream-api-key
    header: X-Api-Key
    env: UPSTREAM_API_KEY
  - name: upstream-auth
    header: Authorization
    env: UPSTREAM_AUTH_TOKEN
